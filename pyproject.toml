[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdash"
version = "0.1.0"
description = "Store, serve, and view time-series geolocation data (active 911 incidents, extensible to APRS/weather/etc.)"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dan DeFelippi", email = "dan@driverdan.com" }]
dependencies = [
    "fastapi>=0.141.1,<0.143.0",
    "uvicorn[standard]>=0.51,<0.55",
    "sqlalchemy[asyncio]>=2.0.51,<2.2.0",
    "asyncpg>=0.31,<0.33",
    "psycopg[binary]~=3.3.4",      # sync driver, used by Alembic
    "geoalchemy2~=0.20.0",
    "alembic>=1.18.5,<1.21.0",
    "apscheduler~=3.11.3",
    "httpx~=0.28.1",
    "pydantic>=2.13.4,<2.15.0",
    "pydantic-settings>=2.16.2,<2.17.0",
    "feedparser~=6.0.12",
    "icalendar>=7.2,<7.4",
    "beautifulsoup4~=4.15.0",      # CarCruiseFinder scraper (stdlib html.parser backend)
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.1",
    "pre-commit>=4.6.1,<4.8.0",
    "ruff>=0.17.4,<0.18.0",
    "mypy>=2.4.1,<2.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Ruff 0.17 also formats Python code blocks in Markdown; OpenSpec artifacts are
# historical records (and snippets there are often fragments), so leave them as written.
extend-exclude = ["openspec"]

[tool.ruff.lint]
# Ruff's default rules (E4, E7, E9, F) plus import sorting (I), pyupgrade (UP),
# bugbear (B), simplify (SIM), blind-except (BLE), and RUF100 so every `noqa`
# names an enabled rule that would otherwise fire. Ruff format handles the rest;
# the hook, CI, and a manual `uv run ruff` all share this config.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` parameter default is the framework idiom, not a bug (B008).
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
# Type-checks app/ only (tests/ and alembic/ are out of scope). Not a commit hook:
# it checks the whole package, so run it as `uv run mypy`; CI's lint job enforces it.
python_version = "3.14"
files = ["app"]
strict = true
# Relaxed: bare `dict`/`list` annotations are still allowed. Requiring type
# arguments everywhere is a separate follow-up, not part of this rule set.
disallow_any_generics = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No stubs or py.typed marker.
module = ["feedparser.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app", "app.*"]
