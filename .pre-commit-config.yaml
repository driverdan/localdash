# Auto-runs linters/formatters on staged files. Install once: `pre-commit install`.
# Fix-then-abort: hooks auto-fix, and if anything changed the commit fails so you
# review the edits and re-commit. See openspec/changes/archive for rationale.
repos:
  # Python: ruff runs from the project's locked dev dependencies via `uv run`, so
  # the hook, a manual `uv run ruff`, and CI all use the one ruff version in
  # uv.lock (no separate pin to keep in step). Needs `uv` on PATH. --locked fails
  # instead of re-locking if pyproject.toml was edited without `uv lock`; --extra
  # dev installs ruff into a venv synced without extras. mypy is deliberately NOT
  # here: it checks the whole package (run `uv run mypy`; CI's lint job enforces it).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --locked --extra dev ruff check --fix
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --locked --extra dev ruff format
        types_or: [python, pyi]
        require_serial: true

  # Frontend: prettier reuses the repo's own Node toolchain (frontend/node_modules,
  # already required for builds and svelte-check). Runs from frontend/ so the
  # svelte plugin and .prettierrc resolve; the frontend/ prefix is stripped from
  # each staged path. svelte-check is intentionally NOT here — it's a whole-project
  # type checker, kept as `npm run check` (see design.md).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: bash -c 'cd frontend && exec ./node_modules/.bin/prettier --write "${@#frontend/}"' --
        files: ^frontend/.*\.(ts|svelte|css|json)$
