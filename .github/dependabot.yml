version: 2

updates:
  # Actions pinned in .github/workflows/. Without this the pins in tests.yml
  # silently rot; nothing else updates them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # Frontend (Svelte + Vite + Leaflet). package-lock.json means Dependabot can
  # resolve exact versions, so this is the ecosystem that produces real PRs.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  # Python deps declared in pyproject.toml, pinned transitively by uv.lock.
  # Both halves matter: the `~=` ranges mean a new minor no longer satisfies the
  # spec (a `>=` floor always did, which is why this ecosystem used to produce
  # nothing but security PRs), and the lockfile lets Dependabot resolve exact
  # versions — it updates pyproject.toml and uv.lock in the same PR, so the two
  # never drift. Requires the "uv" ecosystem; the "pip" one cannot read uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  # Base images in the multi-stage Dockerfile (node:24-slim, python:3.14-slim,
  # and the pinned ghcr.io/astral-sh/uv used by the deps stage).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"

  # Service images in docker-compose.yml. cloudflared is pinned to `latest` and
  # so is never updated here; timescaledb-ha is the one that moves.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
