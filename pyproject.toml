[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdash"
version = "0.1.0"
description = "Store, serve, and view time-series geolocation data (active 911 incidents, extensible to APRS/weather/etc.)"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dan DeFelippi", email = "dan@driverdan.com" }]
dependencies = [
    "fastapi~=0.139.0",
    "uvicorn[standard]~=0.51.0",
    "sqlalchemy[asyncio]~=2.0.51",
    "asyncpg~=0.31.0",
    "psycopg[binary]~=3.3.4",      # sync driver, used by Alembic
    "geoalchemy2~=0.20.0",
    "alembic~=1.18.5",
    "apscheduler~=3.11.3",
    "httpx~=0.28.1",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.14.2",
    "feedparser~=6.0.12",
    "icalendar~=7.2.0",
    "beautifulsoup4~=4.15.0",      # CarCruiseFinder scraper (stdlib html.parser backend)
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pre-commit~=4.6.0",
    "ruff~=0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Conservative default rule set plus import sorting (I). Ruff format handles
# the rest; both the hook and a manual `ruff` run share this config.
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
packages = ["app", "app.collectors", "app.api", "app.news", "app.events", "app.events.sources"]
