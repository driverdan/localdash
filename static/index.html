<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LocalDash</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>LocalDash</h1>
    <span id="status-bar" class="status-bar">connecting…</span>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <section class="filters">
        <h2>Filters</h2>
        <label>Sources
          <div id="source-filters" class="checks"></div>
        </label>
        <label>Category
          <div id="category-filters" class="checks"></div>
        </label>
        <label>Status
          <select id="status-filter"><option value="">All</option></select>
        </label>
        <label>Jurisdiction
          <select id="jurisdiction-filter"><option value="">All</option></select>
        </label>
        <label>Search
          <input id="search" type="text" placeholder="type, location…" />
        </label>
        <label class="inline">
          <input id="show-closed" type="checkbox" />
          Show recently closed
        </label>
        <label id="closed-window-row" class="hidden">Closed within
          <select id="closed-window">
            <option value="30">30 min</option>
            <option value="60" selected>1 hour</option>
            <option value="180">3 hours</option>
            <option value="720">12 hours</option>
          </select>
        </label>
      </section>

      <section class="table-wrap">
        <h2>Active (<span id="count">0</span>)</h2>
        <table id="incident-table">
          <thead>
            <tr><th>Source</th><th>Category</th><th>Status</th><th>Type</th><th>Location</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </aside>

    <main id="map"></main>
  </div>

  <div id="detail" class="detail hidden">
    <button id="detail-close" class="close">&times;</button>
    <div id="detail-body"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/app.js"></script>
</body>
</html>
