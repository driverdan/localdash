[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localdash"
version = "0.1.0"
description = "Store, serve, and view time-series geolocation data (active 911 incidents, extensible to APRS/weather/etc.)"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dan DeFelippi", email = "dan@driverdan.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",        # sync driver, used by Alembic
    "geoalchemy2>=0.14",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "feedparser>=6.0",
    "icalendar>=5.0",
    "beautifulsoup4>=4.12",       # CarCruiseFinder scraper (stdlib html.parser backend)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Conservative default rule set plus import sorting (I). Ruff format handles
# the rest; both the hook and a manual `ruff` run share this config.
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
packages = ["app", "app.collectors", "app.api", "app.news", "app.events", "app.events.sources"]
