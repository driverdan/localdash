name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
# Runs on main are never cancelled (group includes the ref).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists a pull request's changed files through the API.
  pull-requests: read

jobs:
  # Classifies each run's changed files so the test jobs run only when files
  # they exercise changed. Filtering lives here (a job-level `if:`), not in an
  # `on.*.paths` filter: all three jobs are required status checks, and a job
  # skipped via `if:` reports success — whereas a workflow skipped via
  # `on.paths` never reports the check and leaves the PR blocked forever. Each
  # filter also matches this workflow file, so any CI edit forces the full run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # On push, paths-filter diffs before…after with local git, so the repo
      # must be checked out; on pull_request it reads changed files from the API
      # and needs no checkout. The push trigger means the checkout is required.
      - uses: actions/checkout@v7

      # Pinned to a major tag like the other actions; Dependabot's
      # github-actions ecosystem bumps it.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'app/**'
              - 'tests/**'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/tests.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/tests.yml'
            docker:
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - '.github/workflows/tests.yml'

  pytest:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    services:
      # The DB-backed tests (tests/test_ingest.py, test_api_timeseries.py,
      # test_news_db.py, test_events_*) auto-skip when DATABASE_URL is
      # unreachable — silently, and skips don't fail a build. Running the same
      # image as docker-compose is what keeps CI an actual gate rather than a
      # green light for the offline subset.
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: localdash
          POSTGRES_PASSWORD: localdash
          POSTGRES_DB: localdash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://localdash:localdash@localhost:5432/localdash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Matches the runtime image in the Dockerfile.
          python-version: "3.14"

      # Pinned to a full version, unlike the other actions here: setup-uv stopped
      # publishing a moving major tag after v7, so `@v8` does not resolve.
      # Dependabot's github-actions ecosystem bumps it.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          # Matches the uv pinned in the Dockerfile's deps stage.
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails the build if uv.lock and pyproject.toml disagree, which is
      # what keeps the lock honest: a dependency edit that skips `uv lock` cannot
      # merge. It must be --locked, not --frozen — the latter installs the lock
      # as-is without checking it against pyproject, so drift would sail through.
      - name: Install
        run: uv sync --locked --extra dev

      # `static/` is a gitignored build artifact, so a fresh checkout has none —
      # and main.py mounts it at import time, which hard-fails collection for
      # every test that imports the app. No test reads a built asset, so the
      # empty directory is enough; building the frontend here would buy nothing.
      - name: Create static mount target
        run: mkdir -p static

      # Creates the news/events tables the DB-backed fixtures need; the fixtures
      # skip rather than fail when they are missing.
      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -rs

  # The frontend has no test suite yet (no runner, no *.test.ts) — there is
  # nothing to execute. Until there is, its real gates are the strict
  # svelte-check pass AGENTS.md requires to stay at 0 errors, and the build
  # itself. Both catch what npm dependency bumps actually break, which pytest
  # never sees.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the frontend build stage in the Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  # Builds the production image whenever its contents could have changed so a
  # broken Dockerfile can't merge — neither test job above exercises it. Pushes
  # to Docker Hub happen only on pushes to main (the push trigger is filtered to
  # that branch, so the event name alone is the branch check).
  docker:
    runs-on: ubuntu-latest
    # A bare `needs: [pytest, frontend]` treats a *skipped* job as unmet, so a
    # one-sided change (only Python, or only frontend) would wrongly skip the
    # build. This guard builds when either test job ran (python || frontend) or
    # the image files changed, while `!failure() && !cancelled()` still keeps a
    # broken or half-run suite from producing — or pushing — an image.
    needs: [changes, pytest, frontend]
    if: >-
      ${{ !cancelled() && !failure() &&
          (needs.changes.outputs.python == 'true' ||
           needs.changes.outputs.frontend == 'true' ||
           needs.changes.outputs.docker == 'true') }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Conditioned on the event, not just present: PR runs build without
      # credentials, so fork PRs (which never see secrets) stay green, and a
      # build-only run has no reason to touch the registry at all.
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest tracks the newest green main commit; the sha- tag pins each
      # published build so a rollback can name an exact image.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: driverdan/localdash
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max caches every stage, not just the final image's layers —
          # the frontend (npm ci) and deps (uv sync) stages are the expensive
          # ones, and they only exist as cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
