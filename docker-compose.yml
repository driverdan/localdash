services:
  db:
    # TimescaleDB image that bundles PostGIS — gives us hypertables + spatial types together.
    image: timescale/timescaledb-ha:pg16
    container_name: localdash-db
    environment:
      POSTGRES_USER: localdash
      POSTGRES_PASSWORD: localdash
      POSTGRES_DB: localdash
    ports:
      - "5432:5432"
    volumes:
      - localdash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localdash"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: localdash-app
    depends_on:
      db:
        condition: service_healthy
    # Every setting in an optional .env (see .env.example) reaches the app, so
    # README's configuration advice works under Docker too. Unset settings keep
    # the app's own defaults (app/config.py). Change .env, then
    # `docker compose up -d` to recreate the container — no rebuild needed.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reached at host "db". This
      # overrides any DATABASE_URL in .env (which points at localhost for local dev).
      DATABASE_URL: postgresql+asyncpg://localdash:localdash@db:5432/localdash
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Cloudflare named tunnel — exposes the app publicly over HTTPS without opening
  # any inbound ports (cloudflared dials OUT to Cloudflare, so it works behind NAT).
  # Opt-in: only starts with `docker compose --profile tunnel up`. Create the tunnel
  # in the Cloudflare Zero Trust dashboard, route its public hostname to
  # http://app:8000, and put the tunnel token in .env as CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: localdash-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?`-required: compose interpolates every service even when its profile
      # is off, so a hard requirement would break plain `docker compose up`.
      # Without a token, cloudflared itself fails at start with a clear error.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  localdash_pgdata:
